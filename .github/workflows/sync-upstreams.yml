name: Sync Upstream Repositories

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # required for the final push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync repo1 (KJH998)
        run: |
          git remote remove upstream-repo1 2>/dev/null || true
          git remote add upstream-repo1 https://github.com/phu889/kjh998.git
          git fetch upstream-repo1
          if [ -d KJH998 ]; then
            git subtree pull --prefix=KJH998 upstream-repo1 main --squash
          else
            git subtree add --prefix=KJH998 upstream-repo1 main --squash
          fi

      - name: Sync repo2 (EHR663)
        run: |
          git remote remove upstream-repo2 2>/dev/null || true
          git remote add upstream-repo2 https://github.com/FGBLH/EHR663.git
          git fetch upstream-repo2
          if [ -d EHR663 ]; then
            git subtree pull --prefix=EHR663 upstream-repo2 main --squash
          else
            git subtree add --prefix=EHR663 upstream-repo2 main --squash
          fi

      - name: Sync repo3 (EasyTVbox)
        run: |
          git remote remove upstream-repo3 2>/dev/null || true
          git remote add upstream-repo3 https://github.com/EasyXC/EasyTVbox.git
          git fetch upstream-repo3
          if [ -d EasyTVbox ]; then
            git subtree pull --prefix=EasyTVbox upstream-repo3 main --squash
          else
            git subtree add --prefix=EasyTVbox upstream-repo3 main --squash
          fi

      - name: Push changes (only if there are any)
        run: |
          if git diff --quiet HEAD origin/main 2>/dev/null; then
            echo "No changes to push"
          else
            git push origin HEAD:main
          fi